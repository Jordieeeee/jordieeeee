name: Profile card

on:
  schedule:
    # 21:00 UTC = 05:00 Asia/Manila. Cron on GitHub is best-effort and can be
    # delayed under load; this card does not need to be punctual.
    - cron: "0 21 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/card-config.json"
      - ".github/assets/portrait.txt"
      - ".github/scripts/generate_card.py"
      - ".github/workflows/profile-card.yml"

# Never let a scheduled run and a manual run race on the same commit.
concurrency:
  group: profile-card
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render SVG cards
        env:
          # GH_PAT is optional. Without it the built-in GITHUB_TOKEN is used,
          # which can only see public data — private repos are excluded from
          # the commit and line counts. Add a fine-grained PAT with read
          # access to metadata + contents if you want private repos included.
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/generate_card.py

      - name: Commit if changed
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/neofetch-dark.svg assets/neofetch-light.svg .github/stats-cache.json
          # An unconditional commit would add a no-op commit every single day and
          # inflate the very commit count this card reports. Only commit on change.
          if git diff --staged --quiet; then
            echo "No change — nothing to commit."
          else
            git commit -m "chore: refresh profile card [skip ci]"
            git push
          fi
